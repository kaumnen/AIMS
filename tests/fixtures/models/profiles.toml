# The profiles the recordings in this folder were made with. A replay finds each answer by the
# request body, so the model ids and the settings that shape a request stay as recorded.

[profiles.responses-model]
backend = "responses"
base_url = "https://api.example.com/v1"
model = "muse-spark-1.3-contributor"
weights = "example/responses-model"
api_key_env = "MODEL_API_KEY"
reasoning = "summary"
effort = "medium"
summary = "auto"
max_output_tokens = 16384
context_tokens = 1048576
parallel_tool_calls = false

[profiles.chat-model]
backend = "chat"
base_url = "https://api.example.com/v1"
model = "accounts/fireworks/models/muse-spark-open"
weights = "example/chat-model"
api_key_env = "MODEL_API_KEY"
reasoning = "full"
effort = "medium"
max_output_tokens = 16384
context_tokens = 1048576
parallel_tool_calls = false

[profiles.chat-model-b]
backend = "chat"
base_url = "https://api.example.com/v1"
model = "meta-models/muse-spark-open-1026"
weights = "example/chat-model"
api_key_env = "MODEL_API_KEY"
reasoning = "full"
effort = "medium"
max_output_tokens = 16384
context_tokens = 1048576
parallel_tool_calls = false

[profiles.local-model]
backend = "chat"
base_url = "https://api.example.com/v1"
model = "muse-glimmer"
weights = "example/local-model"
api_key_env = "MODEL_API_KEY"
reasoning = "full"
effort = "high"
effort_kwarg = "reasoning_strength"
structured_output = false
max_output_tokens = 16384
context_tokens = 131072
parallel_tool_calls = false
sampling = { temperature = 1.0, top_p = 0.95, top_k = 64 }
timeouts = { connect = 30, stall = 600, wall = 1800 }

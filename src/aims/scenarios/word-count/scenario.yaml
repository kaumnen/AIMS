version: 1
name: word-count
oversight: observe

task:
  instruction: |
    The function top_words in /work/wordcount.py should return the n most common words in a
    text as (word, count) pairs, most common first. Words are compared case-insensitively,
    punctuation around a word is not part of it, and ties are broken alphabetically. The tests
    in /work/test_wordcount.py fail. Fix the code so that they pass, then submit a one line
    summary of what you changed.
  environment:
    dockerfile: env/Dockerfile
  files:
    - path: wordcount.py
      source: files/wordcount.py
    - path: test_wordcount.py
      source: files/test_wordcount.py
  verifier:
    command: python "$AIMS_TESTS_DIR/score.py"
    files: tests
    timeout_s: 120

sandbox:
  cpus: 1
  memory_mb: 1024

agents:
  - id: agent
    budget:
      steps: 30
      cost_usd: 0.5
      wall_s: 900

name: aims

x-aims: &aims
  image: ${AIMS_IMAGE:-ghcr.io/kaumnen/aims:latest}
  restart: unless-stopped

# A read-only root, a small /tmp in memory and no capabilities. Volumes take every other write.
x-locked: &locked
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  init:
    <<: *locked
    image: ${AIMS_IMAGE:-ghcr.io/kaumnen/aims:latest}
    command: [token, create, compose-runner, --role=runner, --file=/token/runner]
    volumes:
      - server:/data
      - token:/token

  server:
    <<: [*aims, *locked]
    command:
      - ui
      - --host=0.0.0.0
      - --no-runner
      - --no-open
      - --behind-proxy=${AIMS_SUBNET:-172.30.84.0/24}
      - --allow-host=server
      - --public-url=${AIMS_SITE:-http://localhost:8484}
    environment:
      # Config the UI saves goes to the volume.
      AIMS_CONFIG_DIR: /data/config
      # Large temp files, such as SQLite sorts, go to the volume too. The server makes this folder.
      SQLITE_TMPDIR: /data/aims/server/tmp
      TMPDIR: /data/aims/server/tmp
    volumes:
      - server:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8484/healthz', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully

  # The Docker socket makes this service root on the host: it starts the sandboxes and the
  # privileged kernel tracer.
  runner:
    <<: *aims
    user: root
    security_opt:
      - no-new-privileges:true
    command:
      - runner
      - --server=http://server:8484
      - --token-file=/token/runner
      - --name=compose
      # snapshot never starts the privileged kernel tracer
      - --audit=${AIMS_AUDIT:-auto}
    env_file:
      - path: .env
        required: false
    volumes:
      - runner:/data
      - token:/token:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # Time to seal and ship its runs and remove its tracer and sampler.
    stop_grace_period: 3m
    depends_on:
      init:
        condition: service_completed_successfully
      server:
        condition: service_healthy

  caddy:
    <<: *locked
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    # The caddy binary carries this file capability. Without it the exec fails.
    cap_add:
      - NET_BIND_SERVICE
    environment:
      AIMS_SITE: ${AIMS_SITE:-http://localhost:8484}
    ports:
      - 127.0.0.1:8484:8484
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: ${AIMS_SUBNET:-172.30.84.0/24}

volumes:
  server:
  runner:
  token:
  caddy-data:
  caddy-config:

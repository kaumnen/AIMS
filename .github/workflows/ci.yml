name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      AIMS_REQUIRE_DOCKER: "1"
      AIMS_REQUIRE_TRACER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest -n 4 --dist loadfile -m "not serial"
      # The tracer and sampler tests need the runner to themselves.
      - run: uv run pytest -m serial

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uvx zizmor@1.31.1 --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run gen && git diff --exit-code src/api/schema.gen.ts
      - run: bun fmt --check
      - run: bun run lint
      - run: bun check
      - run: bun run test
      - run: bun run build
      - run: bun run budget

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag aims:ci .
      - run: docker run --rm aims:ci --version
      - name: serve the UI from the image
        run: |
          docker run -d --name aims -p 127.0.0.1:8484:8484 aims:ci \
            ui --host 0.0.0.0 --no-runner --no-open --behind-proxy 172.16.0.0/12
          get() { curl -fsS --retry 30 --retry-all-errors --retry-delay 1 "http://localhost:8484$1"; }
          if ! { app=$(get / | grep -o '/assets/app-[^"]*\.js') && get "$app" >/dev/null; }; then
            docker logs aims
            exit 1
          fi

  ui-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      # The pass reuses the runs the bench seeded and pushed.
      - run: bun run bench --out bench-results.json --dir "$RUNNER_TEMP/plane"
        working-directory: web
      - run: bun run pass --out pass-shots --dir "$RUNNER_TEMP/plane"
        if: success() || failure()
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: web/bench-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pass-shots
          path: web/pass-shots
          if-no-files-found: ignore

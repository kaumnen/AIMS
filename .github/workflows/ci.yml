name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      # Every job on both Python versions, whatever changed.
      full:
        type: boolean
        default: false

permissions:
  contents: read

# A push to main is compared with the push before it, so each one runs to its end: a cancelled
# run would leave its change untested. A pull request is compared with its base each time, so a
# new commit replaces the run of the last one. The name is the caller's in a called run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs the change needs. The rules are in .github/changes.py.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.pick.outputs.python }}
      containers: ${{ steps.pick.outputs.containers }}
      web: ${{ steps.pick.outputs.web }}
      image: ${{ steps.pick.outputs.image }}
      bench: ${{ steps.pick.outputs.bench }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      # Two commits deep: a pull request is checked out as its merge commit, whose first parent
      # is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A push names the commit it replaced, which the checkout did not fetch. A base that is
      # missing or cannot be fetched turns every job on.
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse --verify --quiet HEAD^1) || base=
          else
            base=$BEFORE
            case $base in
              "" | *[!0-9a-f]*) base= ;;
              *) git fetch --quiet --depth=1 origin "$base" || true ;;
            esac
          fi
          python3 .github/changes.py --base "$base" --forced "$FORCED" --full "$FULL"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["3.14", "3.15"]' || '["3.15"]') }}
        # Coverage is measured on one leg, as no code depends on the Python version.
        include:
          - python: "3.15"
            coverage: true
    env:
      UV_PYTHON: ${{ matrix.python }}
      AIMS_REQUIRE_DOCKER: "1"
      AIMS_REQUIRE_TRACER: "1"
      CONTAINERS: ${{ needs.changes.outputs.containers }}
      # Added to both test runs when the change cannot reach the container tests.
      LEAVE_OUT: ${{ needs.changes.outputs.containers != 'true' && ' and not docker and not tracer' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest -n 4 --dist loadfile -m "not serial and not timing$LEAVE_OUT"
        env:
          PYTEST_ADDOPTS: ${{ matrix.coverage && '--cov' || '' }}
      # A run without the container tests would report a lower number.
      - if: matrix.coverage && env.CONTAINERS == 'true'
        run: echo "Coverage $(uv run coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"
      # The tracer and sampler tests need the runner to themselves, and the timing tests fail on
      # a busy one. -v names a test that times out, as the timeout ends the process before the
      # summary.
      - run: uv run pytest -m "(serial or timing)$LEAVE_OUT" -v

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - run: uvx zizmor@1.32.0 --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run gen && git diff --exit-code src/api/schema.gen.ts
      - run: bun fmt --check
      - run: bun run lint
      - run: bun check
      - run: bun run test
      - run: bun run build
      - run: bun run budget

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag aims:ci .
      - run: docker run --rm aims:ci --version
      - name: serve the UI from the image
        run: |
          docker run -d --name aims -p 127.0.0.1:8484:8484 aims:ci \
            ui --host 0.0.0.0 --no-runner --no-open --behind-proxy 172.16.0.0/12
          get() { curl -fsS --retry 30 --retry-all-errors --retry-delay 1 "http://localhost:8484$1"; }
          if ! { app=$(get / | grep -o '/assets/app-[^"]*\.js') && get "$app" >/dev/null; }; then
            docker logs aims
            exit 1
          fi

  ui-bench:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      # The pass reuses the runs the bench seeded and pushed.
      - run: bun run bench --out bench-results.json --dir "$RUNNER_TEMP/plane"
        working-directory: web
      - run: bun run pass --out pass-shots --dir "$RUNNER_TEMP/plane"
        if: success() || failure()
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: web/bench-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pass-shots
          path: web/pass-shots
          if-no-files-found: ignore

  # The one check a branch rule needs. Each job must have run and passed when the change asked
  # for it, and must have been left out when it did not.
  ci:
    needs: [changes, python, workflows, web, image, ui-bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '
            def ran(job; switch):
              .[job].result == (if .changes.outputs[switch] == "true" then "success" else "skipped" end);
            .changes.result == "success" and .workflows.result == "success"
            and ran("python"; "python") and ran("web"; "web")
            and ran("image"; "image") and ran("ui-bench"; "bench")
          ' <<< "$NEEDS" > /dev/null
